schema: flamehaven.e2a-resource-claim-ledger.v1
valid_as_of: "2026-10-22"
reviewed_on: "2026-10-22"
# Evidence index only. Each claim retains its own dated evidence boundary.
# Strict L2, L3, D and C01 retain separate 10/6 compiled receipts.
# C02 admits only two equalities from a separate 10/7 replay reviewed on 10/8.
# C03 admits zero identity, zero positivity and global continuity from its 10/8 replay.
# C04 admits only its per-Profile existential positive-eta radius from the 10/10 replay.
# Z-core and Z+J named scopes are admitted by separate 10/12 receipts after new replay/archive review.
# Both share one execution/trust domain; original metadata remains NONE/UNVERIFIED.
# P1's ten exact-real margin/normalization propositions have one scoped 10/22 receipt.
# Each retains its own explicit hypotheses; OE-2 and numerical/non-claim boundaries remain.
# Entries retain their individual evidence dates; no uniform/numerical epsilon or Q pole is admitted.
# falsifier: claim-domain contradiction, not compile/identity failure.
# admission_failure: reason an execution record cannot be accepted.
# reopening_condition: prerequisite for resuming held work, not a falsifier.
# These are specified conditions, not observed/tested outcomes; null = unspecified.
status_enum:
  - CONFIRMED
  - SUPPORTED
  - UNVERIFIED
  - HELD
  - CONTRADICTED
  - HYPOTHESIS
  - OUT_OF_SCOPE

