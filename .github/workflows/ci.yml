name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_NS_REVISION: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out NSRW
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Pytest and coverage gate
        run: python -m pytest

  research-custody:
    name: NSRW contract, SPAR, mutation, and replay gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out NSRW
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic research receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m nsrw --no-verify-sources --output outputs/research-a.json
          python -m nsrw --no-verify-sources --output outputs/research-b.json
          python -m nsrw.math_cli --output outputs/math-a.json
          python -m nsrw.math_cli --output outputs/math-b.json
          python -m nsrw.analytic_cli --output outputs/analytic-a.json
          python -m nsrw.analytic_cli --output outputs/analytic-b.json
          python -m nsrw.m3_cli > outputs/m3-a.json
          python -m nsrw.m3_cli > outputs/m3-b.json
          cmp outputs/research-a.json outputs/research-b.json
          cmp outputs/math-a.json outputs/math-b.json
          cmp outputs/analytic-a.json outputs/analytic-b.json
          cmp outputs/m3-a.json outputs/m3-b.json
      - name: Verify M4 hard gate, SPAR identity, and mutations
        run: >-
          python -c "from pathlib import Path; from nsrw.m4_audit import inspect_spar_identity,load_manifest,run_m4_audit,verify_compiled_evidence;
          m=load_manifest(Path('fixtures/m4-parametric-pilot-v2.json')); r=run_m4_audit(m,evidence_root=Path('.'));
          assert inspect_spar_identity()['check_status']=='PASS';
          assert all(x.check_status=='PASS' for x in verify_compiled_evidence(m,Path('.')));
          assert r['task_status']=='HELD';
          assert all(x['killed'] for x in r['mutations']);
          assert r['lane_status']['M4-S']=='HELD[NONCOMPUTABLE_SOURCE_INSTANCE]'"
      - name: Verify portable external artifacts
        run: >-
          python -c "import json;
          json.load(open('fixtures/external-e2-contract-v1.json',encoding='utf-8'));
          n=json.load(open('colab/NSRW_E2_HF_FNO_DATASET_AUDIT.ipynb',encoding='utf-8'));
          assert not any(c.get('outputs') for c in n.get('cells',[]))"

  lean-scoped-targets:
    name: Pinned Lean targets consumed by M4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out pinned formal source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: ${{ env.OPENAI_NS_REVISION }}
      - name: Verify formal-source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OPENAI_NS_REVISION"
      - name: Check out NSRW verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: nsrw
      - name: Install pinned Lean toolchain and build scoped targets
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: true
          build-args: >-
            +NavierStokes.OutgoingDilation
            +NavierStokes.OutgoingCone
            +NavierStokes.NominalConeAssembly
          test: false
          lint: false
          use-github-cache: true
      - name: Capture target hashes and direct dependency surfaces
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .lake/build/lib/lean/NavierStokes/OutgoingDilation.olean \
            .lake/build/lib/lean/NavierStokes/OutgoingCone.olean \
            .lake/build/lib/lean/NavierStokes/NominalConeAssembly.olean \
            | tee lean-target-sha256.txt
          lake env lean --deps NavierStokes/OutgoingDilation.lean > outgoing-dilation-deps.txt
          lake env lean --deps NavierStokes/OutgoingCone.lean > outgoing-cone-deps.txt
          lake env lean --deps NavierStokes/NominalConeAssembly.lean > nominal-cone-deps.txt
      - name: Build and cross-check structured Lean receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          targets = {
              "+NavierStokes.OutgoingDilation": (
                  ".lake/build/lib/lean/NavierStokes/OutgoingDilation.olean",
                  "outgoing-dilation-deps.txt",
              ),
              "+NavierStokes.OutgoingCone": (
                  ".lake/build/lib/lean/NavierStokes/OutgoingCone.olean",
                  "outgoing-cone-deps.txt",
              ),
              "+NavierStokes.NominalConeAssembly": (
                  ".lake/build/lib/lean/NavierStokes/NominalConeAssembly.olean",
                  "nominal-cone-deps.txt",
              ),
          }
          receipt = {
              "formal_source_commit": "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538",
              "schema_id": "flamehaven.nsrw-lean-compiled-evidence.v1",
              "targets": {},
              "toolchain": "leanprover/lean4:v4.34.0-rc2",
          }
          for target, (olean_path, deps_path) in targets.items():
              receipt["targets"][target] = {
                  "dependency_surface_sha256": hashlib.sha256(Path(deps_path).read_bytes()).hexdigest().upper(),
                  "exit_code": 0,
                  "olean_path": olean_path,
                  "olean_sha256": hashlib.sha256(Path(olean_path).read_bytes()).hexdigest().upper(),
                  "target": target,
              }
          Path("lean-compiled-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cmp lean-compiled-receipt.json nsrw/fixtures/evidence/lean-scoped-targets-v1.json
          PYTHONPATH=nsrw/src python -c "from pathlib import Path; from nsrw.m4_audit import load_manifest,run_m4_audit; m=load_manifest(Path('nsrw/fixtures/m4-parametric-pilot-v2.json')); r=run_m4_audit(m,lean_root=Path('.'),evidence_root=Path('nsrw')); assert r['check_status']=='PASS'; assert r['task_status']=='COMPLETED'; assert all(x['killed'] for x in r['mutations']); assert all(x['check_status']=='PASS' for x in r['checks'] if x['check_id'].startswith(('source_quantifier_binding:','compiled_receipt:')))"
      - name: Upload scoped Lean evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-lean-target-evidence
          path: |
            lean-target-sha256.txt
            outgoing-dilation-deps.txt
            outgoing-cone-deps.txt
            nominal-cone-deps.txt
            lean-compiled-receipt.json
          if-no-files-found: error
          retention-days: 30
