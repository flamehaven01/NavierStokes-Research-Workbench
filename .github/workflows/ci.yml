name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAI_NS_REVISION: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out NSRW
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Pytest and coverage gate
        run: python -m pytest

  research-validation:
    name: Research contracts, structural checks, mutations, and replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out NSRW
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic research receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m nsrw --no-verify-sources --output outputs/research-a.json
          python -m nsrw --no-verify-sources --output outputs/research-b.json
          python -m nsrw.math_cli --output outputs/math-a.json
          python -m nsrw.math_cli --output outputs/math-b.json
          python -m nsrw.analytic_cli --output outputs/analytic-a.json
          python -m nsrw.analytic_cli --output outputs/analytic-b.json
          python -m nsrw.m3_cli > outputs/m3-a.json
          python -m nsrw.m3_cli > outputs/m3-b.json
          cmp outputs/research-a.json outputs/research-b.json
          cmp outputs/math-a.json outputs/math-b.json
          cmp outputs/analytic-a.json outputs/analytic-b.json
          cmp outputs/m3-a.json outputs/m3-b.json
      - name: Verify required M4 checks, dependency identity, and mutations
        run: >-
          python -c "from pathlib import Path; from nsrw.m4_audit import inspect_spar_identity,load_manifest,run_m4_audit,verify_compiled_evidence;
          m=load_manifest(Path('fixtures/m4-parametric-pilot-v3.json')); r=run_m4_audit(m,evidence_root=Path('.'));
          assert inspect_spar_identity()['check_status']=='PASS';
          assert all(x.check_status=='PASS' for x in verify_compiled_evidence(m,Path('.')));
          assert r['task_status']=='COMPLETED';
          assert len(r['mutations'])==14;
          assert all(x['killed'] is True for x in r['mutations'] if x['killed'] is not None);
          assert r['lane_status']['M4-S']=='HELD[NONCOMPUTABLE_SOURCE_INSTANCE]'"
      - name: Verify portable external artifacts
        run: >-
          python -c "import json;
          json.load(open('fixtures/external-e2-contract-v1.json',encoding='utf-8'));
          n=json.load(open('colab/NSRW_E2_HF_FNO_DATASET_AUDIT.ipynb',encoding='utf-8'));
          assert not any(c.get('outputs') for c in n.get('cells',[]))"
      - name: Validate v3 evidence schemas and strict parser
        run: >-
          python -c "import json; from pathlib import Path; from jsonschema import Draft202012Validator;
          from nsrw.strict_json import parse_strict_json_bytes;
          paths=[Path('contracts/m4-obligation-manifest-v3.schema.json'),Path('contracts/m4-mutation-corpus-v1.schema.json'),Path('contracts/lean-build-request-v1.schema.json'),Path('contracts/lean-compiled-evidence-v1.schema.json'),Path('contracts/lean-compiled-evidence-v2.schema.json'),Path('contracts/lean-execution-provenance-v1.schema.json'),Path('contracts/lean-receipt-migration-v1.schema.json')];
          [Draft202012Validator.check_schema(json.loads(p.read_text(encoding='utf-8'))) for p in paths];
          parse_strict_json_bytes(b'{}'); print('v3-evidence-schemas: PASS')"

  lean-scoped-targets:
    name: Pinned Lean targets consumed by M4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out pinned formal source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: ${{ env.OPENAI_NS_REVISION }}
      - name: Verify formal-source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OPENAI_NS_REVISION"
      - name: Check out NSRW verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: nsrw
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nsrw/pyproject.toml
      - name: Install NSRW receipt dependencies
        working-directory: nsrw
        run: python -m pip install -e .
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - name: Build targets and publish structured live evidence
        shell: bash
        working-directory: nsrw
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m nsrw.lean_receipt \
            --request fixtures/evidence/lean-scoped-build-request-v1.json \
            --source-root .. \
            --dependency-dir outputs/lean-deps \
            --evidence-root . \
            --output outputs/lean-compiled-receipt.json \
            --manifest-template fixtures/m4-parametric-pilot-v3.json \
            --live-manifest-output outputs/m4-parametric-pilot-v3-live.json \
            --provenance-output outputs/lean-execution-provenance.json
          PYTHONPATH=src python -m nsrw.m4_cli \
            outputs/m4-parametric-pilot-v3-live.json \
            --lean-root .. \
            --evidence-root . \
            --output outputs/m4-parametric-pilot-v3-live-receipt.json
      - name: Upload scoped Lean evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-lean-target-evidence
          path: |
            nsrw/outputs/lean-deps/
            nsrw/outputs/lean-compiled-receipt.json
            nsrw/outputs/lean-execution-provenance.json
            nsrw/outputs/m4-parametric-pilot-v3-live.json
            nsrw/outputs/m4-parametric-pilot-v3-live-receipt.json
          if-no-files-found: error
          retention-days: 30
